<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YGO Lua 学习平台</title>
<style>
:root{
  --bg:#0a1020;
  --panel:#131e33;
  --panel2:#18263f;
  --line:#2a3c5d;
  --text:#e6eeff;
  --muted:#a8b9d5;
  --blue:#86a5ff;
  --green:#69e2b2;
  --yellow:#ffd782;
  --red:#ff9aa8;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:
    radial-gradient(ellipse at top right,#172750,transparent 50%),
    var(--bg);
  color:var(--text);
  font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif;
  min-height:100vh;
}
button{
  cursor:pointer;
  padding:9px 14px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--panel2);
  color:var(--text);
  font:inherit;
}
button:hover{border-color:var(--blue)}
button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.primary{background:#486aca;border-color:#6485e6;color:white}
.container{
  max-width:1400px;
  margin:0 auto;
  padding:30px;
}
header{
  padding:32px 0;
  border-bottom:1px solid var(--line);
  margin-bottom:32px;
}
.brand{
  font-size:34px;
  font-weight:800;
  margin-bottom:8px;
}
.subtitle{
  color:var(--muted);
  font-size:15px;
}
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:20px;
}
.statsGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  margin-bottom:32px;
}
.statCard{
  padding:20px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
}
.statLabel{
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:8px;
}
.statValue{
  font-size:32px;
  font-weight:800;
  color:var(--green);
}
.statSub{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}
.sectionTitle{
  font-size:20px;
  font-weight:700;
  margin:0 0 20px;
  color:var(--text);
}
.courseGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:20px;
  margin-bottom:32px;
}
.courseCard{
  padding:22px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  transition:border-color .2s;
}
.courseCard:hover{
  border-color:var(--blue);
}
.courseCard[draggable="true"]{cursor:grab}
.courseCard.dragging{opacity:.45;cursor:grabbing}
.courseCard.dragOver{border-color:var(--green);box-shadow:0 0 0 2px rgba(105,226,178,.2)}
.courseHeader{
  display:flex;
  justify-content:space-between;
  align-items:start;
  margin-bottom:14px;
}
.courseCategory{
  font-size:11px;
  color:var(--yellow);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.1em;
}
.courseBadge{
  padding:3px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  background:#173d34;
  color:var(--green);
}
.courseTitle{
  font-size:18px;
  font-weight:700;
  margin:8px 0;
  color:var(--text);
}
.courseDesc{
  color:var(--muted);
  font-size:13px;
  margin-bottom:16px;
  line-height:1.6;
}
.progressBar{
  height:6px;
  background:#080d18;
  border-radius:999px;
  overflow:hidden;
  margin-bottom:10px;
}
.progressFill{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--green));
  transition:width .3s;
}
.progressText{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--muted);
  margin-bottom:14px;
}
.courseActions{
  display:flex;
  gap:8px;
}
.courseActions button{
  flex:1;
  padding:10px;
  font-size:13px;
}
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.75);
  z-index:1000;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal.show{display:flex}
.modalContent{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:17px;
  padding:28px;
  max-width:520px;
  width:100%;
  max-height:80vh;
  overflow:auto;
}
.modalTitle{
  font-size:20px;
  font-weight:700;
  margin:0 0 18px;
}
.modalActions{
  display:flex;
  gap:10px;
  margin-top:20px;
  justify-content:flex-end;
}
textarea{
  width:100%;
  min-height:200px;
  padding:14px;
  background:#080f1d;
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--text);
  font:13px/1.7 Consolas,monospace;
  resize:vertical;
}
.note{
  padding:12px 14px;
  border-left:3px solid var(--blue);
  border-radius:0 8px 8px 0;
  background:#182943;
  color:#c5d6f2;
  font-size:13px;
  margin:15px 0;
}
.warn{border-left-color:var(--yellow);background:#2a2416;color:#ffe7aa}
code{
  color:#a5edcf;
  background:#0b1526;
  padding:2px 6px;
  border-radius:5px;
  font-family:Consolas,monospace;
  font-size:13px;
}
@media(max-width:700px){
  .container{padding:15px}
  .brand{font-size:26px}
  .courseGrid{grid-template-columns:1fr}
  .statsGrid{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  .toolbar button{width:100%}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">✦ YGO Lua 学习平台</div>
    <div class="subtitle">从零开始学习游戏王卡片脚本编写</div>
    <div class="toolbar">
      <button class="primary" onclick="app.exportProgress()">📥 导出进度</button>
      <button onclick="app.importProgress()">📤 导入进度</button>
      <button onclick="app.showRecovery()">🔑 查看恢复码</button>
      <button onclick="app.clearAll()">🗑️ 清空所有进度</button>
      <button onclick="app.resetCourseOrder()">恢复课程顺序</button>
    </div>
  </header>

  <section class="statsGrid">
    <div class="statCard">
      <div class="statLabel">总体进度</div>
      <div class="statValue" id="totalProgress">0%</div>
      <div class="statSub" id="totalSub">0 / 0 课程完成</div>
    </div>
    <div class="statCard">
      <div class="statLabel">已完成课时</div>
      <div class="statValue" id="completedLessons">0</div>
      <div class="statSub">跨所有课程统计</div>
    </div>
    <div class="statCard">
      <div class="statLabel">最后学习</div>
      <div class="statValue" id="lastStudy" style="font-size:18px;color:var(--blue)">未开始</div>
      <div class="statSub" id="lastCourse">-</div>
    </div>
  </section>

  <h2 class="sectionTitle">📚 全部课程</h2>
  <div class="courseGrid" id="courseGrid"></div>
</div>

<div class="modal" id="importModal">
  <div class="modalContent">
    <h3 class="modalTitle">导入进度数据</h3>
    <div class="note warn">导入会与现有进度合并，不会覆盖已完成的课程</div>
    <textarea id="importData" placeholder="粘贴导出的 JSON 数据"></textarea>
    <div class="modalActions">
      <button onclick="app.closeModal()">取消</button>
      <button class="primary" onclick="app.doImport()">导入</button>
    </div>
  </div>
</div>

<div class="modal" id="recoveryModal">
  <div class="modalContent">
    <h3 class="modalTitle">恢复码</h3>
    <div class="note">
      保存这个恢复码可以在清空缓存或更换设备后恢复进度。
      <strong>不要分享给他人</strong>，否则别人可以修改你的进度。
    </div>
    <textarea id="recoveryCode" readonly></textarea>
    <div class="modalActions">
      <button onclick="app.copyRecovery()">复制到剪贴板</button>
      <button class="primary" onclick="app.closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
"use strict";

// 课程页通过 progress:<courseId> 发布统一摘要；主页只消费摘要，不改动课程私有记录。

const COURSES = [
  {
    id: "lua-interactive",
    file: "Lua-交互式学习平台.html",
    title: "Lua 交互式学习平台",
    category: "基础",
    showProgress: false,
    desc: "浏览器中交互式学习 Lua 语法基础",
    order: 0,
    estimatedLessons: 10
  },
  {
    id: "ygo-stage-01",
    file: "YGO-Lua-课程/YGO-Lua-从第一张卡开始.html",
    title: "从第一张卡开始",
    category: "YGO Lua",
    desc: "学习第一张卡的脚本结构与基础概念",
    order: 1,
    estimatedLessons: 8
  },
  {
    id: "ygo-stage-02",
    file: "YGO-Lua-课程/YGO-Lua-第二阶段发动与处理.html",
    title: "发动与处理",
    category: "YGO Lua",
    desc: "理解效果的发动时机和处理流程",
    order: 2,
    estimatedLessons: 8
  },
  {
    id: "ygo-stage-03",
    file: "YGO-Lua-课程/YGO-Lua-第三阶段代价与发动.html",
    title: "代价与发动",
    category: "YGO Lua",
    desc: "掌握代价支付和发动条件检查",
    order: 3,
    estimatedLessons: 8
  },
  {
    id: "ygo-stage-04",
    file: "YGO-Lua-课程/YGO-Lua-第四阶段区域与筛选.html",
    title: "区域与筛选",
    category: "YGO Lua",
    desc: "学习卡片区域操作和条件筛选",
    order: 4,
    estimatedLessons: 8
  },
  {
    id: "ygo-stage-05",
    file: "YGO-Lua-课程/YGO-Lua-第五阶段取对象与处理.html",
    title: "取对象与处理",
    category: "YGO Lua",
    desc: "深入对象选取机制和效果处理",
    order: 5,
    estimatedLessons: 8
  },
  {
    id: "ygo-stage-06",
    file: "YGO-Lua-课程/YGO-Lua-第六阶段属性筛选.html",
    title: "属性筛选",
    category: "YGO Lua",
    desc: "掌握复杂的属性筛选条件",
    order: 6,
    estimatedLessons: 8
  },
  {
    id: "ygo-lab",
    file: "YGO-效果脚本实验室.html",
    title: "效果脚本实验室",
    category: "实践",
    desc: "综合实践：编写和测试完整的卡片效果",
    order: 7,
    estimatedLessons: 6
    ,showProgress: false
  }
];

try {
  const registry = JSON.parse(localStorage.getItem("course-registry") || "[]");
  registry.forEach(course => {
    if (course.id && !COURSES.some(item => item.id === course.id)) {
      COURSES.push({ ...course, order: course.order ?? COURSES.length });
    }
  });
} catch (_) {}

function applySavedCourseOrder() {
  try {
    const saved = JSON.parse(localStorage.getItem(COURSE_ORDER_KEY) || "null");
    if (!Array.isArray(saved)) return;
    const rank = new Map(saved.map((id, index) => [id, index]));
    COURSES.sort((a, b) => (rank.get(a.id) ?? saved.length + a.order) - (rank.get(b.id) ?? saved.length + b.order));
  } catch (_) {}
}
const PROGRESS_PREFIX = "progress:";
const COURSE_ORDER_KEY = "ygo-learning:course-order:v1";
const DEVICE_TOKEN_KEY = "device-token";
const COURSE_STORAGE_KEYS = {
  "lua-interactive": ["lua-learning-progress"], "ygo-stage-01": ["ygo-lua-foundations-v1"],
  "ygo-stage-02": ["ygo-stage2-unified-v2"], "ygo-stage-03": ["ygo-stage3-cost-v1"],
  "ygo-stage-04": ["ygo-learning:stage-04:v1"], "ygo-stage-05": ["ygo-learning:stage-05-beginner-v2:v1"],
  "ygo-stage-06": ["ygo-learning:stage-06-filter-properties-v1"], "ygo-lab": ["ygo-effect-lab-v1"]
};

applySavedCourseOrder();

const app = {
  getDeviceToken() {
    let token = localStorage.getItem(DEVICE_TOKEN_KEY);
    if (!token) {
      const bytes = new Uint8Array(32);
      crypto.getRandomValues(bytes);
      token = btoa(String.fromCharCode(...bytes))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
      localStorage.setItem(DEVICE_TOKEN_KEY, token);
    }
    return token;
  },

  getProgress(courseId) {
    try {
      const raw = localStorage.getItem(PROGRESS_PREFIX + courseId);
      if (raw) {
        const data = JSON.parse(raw);
        const completed = Array.isArray(data.completed) ? data.completed : [];
        if (completed.length > (Number(data.totalLessons) || 0)) data.totalLessons = completed.length;
        return data;
      }
      return this.getLegacyProgress(courseId);
    } catch {
      return null;
    }
  },

  getLegacyProgress(courseId) {
    const legacyKeys = {
      "lua-interactive": "lua-learning-progress",
      "ygo-stage-01": "ygo-lua-foundations-v1",
      "ygo-stage-02": "ygo-stage2-unified-v2",
      "ygo-stage-03": "ygo-stage3-cost-v1",
      "ygo-stage-04": "ygo-learning:stage-04:v1",
      "ygo-stage-05": "ygo-learning:stage-05-beginner-v2:v1",
      "ygo-stage-06": "ygo-learning:stage-06-filter-properties-v1",
      "ygo-lab": "ygo-effect-lab-v1"
    };
    const key = legacyKeys[courseId];
    if (!key) return null;
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const data = JSON.parse(raw);
      const completed = Array.isArray(data.completed) ? data.completed : (Array.isArray(data.done) ? data.done : []);
      const defaults = { "ygo-stage-04": 8, "ygo-stage-05": 8, "ygo-stage-06": 8, "ygo-lab": 6 };
      if (data.records && !completed.length) {
        Object.entries(data.records).forEach(([id, record]) => {
          if (record?.observed && record?.quiz && record?.exercise) completed.push(id);
        });
      }
      return { ...data, completed, totalLessons: data.totalLessons || defaults[courseId] || 8, lastVisit: data.lastVisit || 0 };
    } catch { return null; }
  },

  saveProgress(courseId, data) {
    localStorage.setItem(PROGRESS_PREFIX + courseId, JSON.stringify(data));
  },

  getAllProgress() {
    const result = {};
    COURSES.forEach(c => {
      if (c.showProgress === false) return;
      const p = this.getProgress(c.id);
      if (p) result[c.id] = p;
    });
    return result;
  },

  calculateStats() {
    let totalCompleted = 0;
    let totalLessons = 0;
    let completedCourses = 0;
    let lastTime = 0;
    let lastCourse = null;

    COURSES.forEach(c => {
      const p = this.getProgress(c.id);
      const completed = p ? (p.completed || []).length : 0;
      const total = p?.totalLessons || c.estimatedLessons;

      totalCompleted += completed;
      totalLessons += total;

      if (completed >= total) completedCourses++;

      if (p?.lastVisit && p.lastVisit > lastTime) {
        lastTime = p.lastVisit;
        lastCourse = c.title;
      }
    });

    return {
      totalCompleted,
      totalLessons,
      completedCourses,
      totalCourses: COURSES.filter(course => course.showProgress !== false).length,
      lastTime,
      lastCourse
    };
  },

  formatTime(timestamp) {
    if (!timestamp) return "未开始";
    const now = Date.now();
    const diff = now - timestamp;
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor(diff / 3600000);
    const mins = Math.floor(diff / 60000);

    if (days > 0) return `${days} 天前`;
    if (hours > 0) return `${hours} 小时前`;
    if (mins > 0) return `${mins} 分钟前`;
    return "刚刚";
  },

  render() {
    const stats = this.calculateStats();

    const progress = stats.totalLessons > 0
      ? Math.round((stats.totalCompleted / stats.totalLessons) * 100)
      : 0;

    document.getElementById("totalProgress").textContent = progress + "%";
    document.getElementById("totalSub").textContent =
      `${stats.completedCourses} / ${stats.totalCourses} 课程完成`;
    document.getElementById("completedLessons").textContent = stats.totalCompleted;
    document.getElementById("lastStudy").textContent = this.formatTime(stats.lastTime);
    document.getElementById("lastCourse").textContent = stats.lastCourse || "-";

    const grid = document.getElementById("courseGrid");
    grid.innerHTML = "";

    COURSES.forEach(course => {
      const p = this.getProgress(course.id);
      const completed = p ? (p.completed || []).length : 0;
      const total = p?.totalLessons || course.estimatedLessons;
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      const isComplete = completed >= total;

      const card = document.createElement("div");
      card.className = "courseCard";
      card.draggable = true;
      card.dataset.courseId = course.id;
      card.addEventListener("dragstart", event => {
        card.classList.add("dragging");
        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData("text/plain", course.id);
      });
      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
        grid.querySelectorAll(".dragOver").forEach(item => item.classList.remove("dragOver"));
      });
      card.addEventListener("dragover", event => {
        event.preventDefault();
        event.dataTransfer.dropEffect = "move";
        card.classList.add("dragOver");
      });
      card.addEventListener("dragleave", event => {
        if (!card.contains(event.relatedTarget)) card.classList.remove("dragOver");
      });
      card.addEventListener("drop", event => {
        event.preventDefault();
        card.classList.remove("dragOver");
        const draggedId = event.dataTransfer.getData("text/plain");
        if (!draggedId || draggedId === course.id) return;
        const from = COURSES.findIndex(item => item.id === draggedId);
        const to = COURSES.findIndex(item => item.id === course.id);
        if (from < 0 || to < 0) return;
        const [moved] = COURSES.splice(from, 1);
        COURSES.splice(to, 0, moved);
        this.saveCourseOrder();
        this.render();
      });
      card.innerHTML = `
        <div class="courseHeader">
          <div class="courseCategory">${course.category}</div>
          ${isComplete ? '<div class="courseBadge">✓ 已完成</div>' : ''}
        </div>
        <div class="courseTitle">${course.title}</div>
        <div class="courseDesc">${course.desc}</div>
        ${course.showProgress === false ? "" : `<div class="progressBar"><div class="progressFill" style="width:${percent}%"></div></div>
        <div class="progressText"><span>${course.category === "YGO Lua" ? `阶段 ${p?.stage ?? course.order} · ` : ""}${completed} / ${total} 课时</span><span>${percent}%${p?.currentStep ? ` · 第 ${p.currentStep + 1} 步` : ""}</span></div>`}
        <div class="courseActions">
          <button class="primary" onclick="app.openCourse('${course.file}')">
            ${completed > 0 ? '继续学习' : '开始学习'}
          </button>
          ${completed > 0 ? `<button onclick="app.resetCourse('${course.id}')">重置</button>` : ''}
        </div>
      `;
      grid.appendChild(card);
    });
  },

  openCourse(file) {
    window.location.href = file;
  },

  saveCourseOrder() {
    localStorage.setItem(COURSE_ORDER_KEY, JSON.stringify(COURSES.map(course => course.id)));
  },

  resetCourseOrder() {
    if (!confirm("恢复默认课程顺序？不会影响学习进度。")) return;
    localStorage.removeItem(COURSE_ORDER_KEY);
    COURSES.sort((a, b) => a.order - b.order);
    this.render();
  },

  resetCourse(courseId) {
    if (!confirm("确定要重置这门课程的进度吗？")) return;
    localStorage.removeItem(PROGRESS_PREFIX + courseId);
    (COURSE_STORAGE_KEYS[courseId] || []).forEach(key => localStorage.removeItem(key));
    this.render();
  },

  exportProgress() {
    const token = this.getDeviceToken();
    const progress = this.getAllProgress();
    const data = {
      version: 1,
      deviceToken: token,
      exportTime: Date.now(),
      progress
    };

    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ygo-lua-progress-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  },

  importProgress() {
    document.getElementById("importModal").classList.add("show");
    document.getElementById("importData").value = "";
  },

  doImport() {
    const text = document.getElementById("importData").value.trim();
    if (!text) return alert("请粘贴进度数据");

    try {
      const data = JSON.parse(text);
      if (!data.progress) throw new Error("数据格式错误");

      Object.entries(data.progress).forEach(([courseId, courseProgress]) => {
        const existing = this.getProgress(courseId);
        if (existing) {
          const merged = {
            ...existing,
            completed: [...new Set([
              ...(existing.completed || []),
              ...(courseProgress.completed || [])
            ])].sort((a, b) => a - b),
            quizCompleted: [...new Set([
              ...(existing.quizCompleted || []),
              ...(courseProgress.quizCompleted || [])
            ])].sort((a, b) => a - b),
            currentLesson: Math.max(
              existing.currentLesson || 0,
              courseProgress.currentLesson || 0
            )
          };
          this.saveProgress(courseId, merged);
        } else {
          this.saveProgress(courseId, courseProgress);
        }
      });

      if (data.deviceToken) {
        localStorage.setItem(DEVICE_TOKEN_KEY, data.deviceToken);
      }

      this.closeModal();
      this.render();
      alert("进度导入成功！");
    } catch (e) {
      alert("导入失败：数据格式错误");
    }
  },

  showRecovery() {
    const token = this.getDeviceToken();
    const progress = this.getAllProgress();
    const data = {
      version: 1,
      deviceToken: token,
      exportTime: Date.now(),
      progress
    };

    document.getElementById("recoveryCode").value = JSON.stringify(data, null, 2);
    document.getElementById("recoveryModal").classList.add("show");
  },

  copyRecovery() {
    const textarea = document.getElementById("recoveryCode");
    textarea.select();
    document.execCommand("copy");
    alert("已复制到剪贴板！");
  },

  closeModal() {
    document.querySelectorAll(".modal").forEach(m => m.classList.remove("show"));
  },

  clearAll() {
    if (!confirm("确定要清空所有进度吗？此操作不可恢复！\n\n建议先导出备份。")) return;
    if (!confirm("再次确认：真的要删除所有学习记录吗？")) return;

    COURSES.forEach(c => {
      localStorage.removeItem(PROGRESS_PREFIX + c.id);
      (COURSE_STORAGE_KEYS[c.id] || []).forEach(key => localStorage.removeItem(key));
    });
    this.render();
    alert("所有进度已清空");
  }
};

app.getDeviceToken();
app.render();

window.addEventListener("storage", () => app.render());
window.addEventListener("focus", () => app.render());

document.querySelectorAll(".modal").forEach(modal => {
  modal.addEventListener("click", e => {
    if (e.target === modal) app.closeModal();
  });
});
</script>
</body>
</html>
